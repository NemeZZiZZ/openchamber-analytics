name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject internal planning documents
        run: |
          if [ -n "$(git ls-files 'docs/superpowers/**')" ]; then
            echo 'docs/superpowers must not be tracked in the public repository'
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install with the committed lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build output checks
        run: npm run check:build

      - name: Guest package check
        run: npm run check:guest

      - name: Verify committed builds match a clean rebuild
        run: |
          git diff --exit-code -- panel/main.js panel/main.css page/main.js page/main.css service/main.js

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          tar -czf "dist/openchamber-analytics-${GITHUB_REF_NAME}.tar.gz" \
            package.json README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md \
            panel/index.html panel/main.js panel/main.css \
            page/index.html page/main.js page/main.css \
            service/main.js

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/openchamber-analytics-*.tar.gz
          generate_release_notes: true
